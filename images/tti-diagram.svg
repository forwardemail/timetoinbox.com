<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .primary { fill: #1e88e5; }
    .secondary { fill: #2ecc71; }
    .accent { fill: #f39c12; }
    .text { fill: #333333; }
    text {
      font-family: Arial, sans-serif;
      dominant-baseline: middle;
    }
  </style>
  
  <!-- Background -->
  <rect width="120" height="120" rx="6" fill="#F8F9FA"/>
  
  <!-- Main container -->
  <rect x="10" y="15" width="100" height="80" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1.5"/>
  
  <!-- Sender icon -->
  <rect x="20" y="25" width="18" height="18" rx="3" class="primary"/>
  <text x="29" y="34" font-size="12" font-weight="bold" text-anchor="middle" fill="white">S</text>
  
  <!-- Receiver icon -->
  <rect x="82" y="25" width="18" height="18" rx="3" class="secondary"/>
  <text x="91" y="34" font-size="12" font-weight="bold" text-anchor="middle" fill="white">R</text>
  
  <!-- Connection line -->
  <path d="M38 34H82" stroke="#4A5568" stroke-width="1.5" stroke-dasharray="3 2"/>
  
  <!-- Email icon -->
  <rect x="51" y="26" width="18" height="16" rx="2" fill="white" stroke="#4A5568" stroke-width="1.5"/>
  <path d="M51 28L60 36L69 28" stroke="#4A5568" stroke-width="1.5"/>
  
  <!-- Timeline -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#4A5568" stroke-width="1.5"/>
  
  <!-- Timeline markers -->
  <circle cx="20" cy="60" r="3" class="primary"/>
  <line x1="20" y1="64" x2="20" y2="56" stroke="#4A5568" stroke-width="1.5"/>
  <text x="20" y="74" font-size="10" text-anchor="middle" class="text">Send</text>
  
  <circle cx="60" cy="60" r="3" class="accent"/>
  <line x1="60" y1="64" x2="60" y2="56" stroke="#4A5568" stroke-width="1.5"/>
  <text x="60" y="74" font-size="10" text-anchor="middle" class="text">TTI</text>
  
  <circle cx="100" cy="60" r="3" class="secondary"/>
  <line x1="100" y1="64" x2="100" y2="56" stroke="#4A5568" stroke-width="1.5"/>
  <text x="100" y="74" font-size="10" text-anchor="middle" class="text">Inbox</text>
  
  <!-- TTI measurement -->
  <path d="M20 90H60" stroke="#f39c12" stroke-width="2"/>
  <text x="40" y="100" font-size="10" font-weight="bold" text-anchor="middle" fill="#f39c12">Time to Inbox</text>
</svg>
